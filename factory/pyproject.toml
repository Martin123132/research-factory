[project]
name = "research-factory-prototype"
version = "0.4.0"
description = "Reproducible human-AI research factory workbench prototype"
requires-python = ">=3.11"
dependencies = [
  "Brotli==1.2.0",
  "cryptography==50.0.0",
  "jsonschema==4.26.0",
  "psutil==7.2.2",
  "zstandard==0.25.0"
]

[project.scripts]
factoryctl = "engine.cli:main"

[tool.setuptools]
packages = ["control_plane", "engine"]

[tool.setuptools.package-data]
engine = ["schemas/*.json"]
control_plane = ["schemas/*.json"]

[tool.unittest]
start-directory = "workbenches/wb001_lossless_compression/tests"
