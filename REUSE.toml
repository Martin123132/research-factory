version = 1
SPDX-PackageName = "Research Factory"
SPDX-PackageSupplier = "Research Factory contributors"
SPDX-PackageDownloadLocation = "https://github.com/Martin123132/research-factory"

# Factory software, configuration and repository automation.
[[annotations]]
path = [
  ".gitattributes",
  ".gitleaksignore",
  ".gitignore",
  ".github/**",
  "build_portfolio.mjs",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Research Factory contributors"
SPDX-License-Identifier = "Apache-2.0"

# Authored project explanations and the descriptive workbench catalogue.
[[annotations]]
path = [
  "*.md",
  "algorithms_workbenches_47.md",
  "engineering_workbenches_47.md",
  "research_factory_100_report_artifact.json",
  "research_factory_100_workbenches.json",
  "candidate_artifacts/README.md",
  "factory/quality/factory-quality-standard-v1.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Research Factory contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# The asset ledger and citation record are factual metadata.
[[annotations]]
path = [
  "ASSET_PROVENANCE.json",
  "CITATION.cff",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Research Factory contributors"
SPDX-License-Identifier = "CC0-1.0"

# Factory code, schemas, configuration and generated functional templates.
[[annotations]]
path = "factory/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Research Factory contributors"
SPDX-License-Identifier = "Apache-2.0"

# Human-readable station, protocol, governance and tutorial documentation.
[[annotations]]
path = "factory/**/*.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Research Factory contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Generated contracts carry the authored catalogue descriptions they snapshot.
[[annotations]]
path = [
  "factory/station_kits/**/contract.json",
  "factory/hangar/data/workbench-contracts.json",
  "factory/hangar/data/workbenches.json",
  "factory/hangar/public/workbench-contracts-v1.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Research Factory contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Factory-created measurements, manifests, locks and synthetic public fixtures.
[[annotations]]
path = [
  "factory/control_plane/software.lock.json",
  "factory/hangar/data/workbench-readiness.json",
  "factory/hangar/data/factory-quality-summary.json",
  "factory/hangar/data/correction-history-example.json",
  "factory/hangar/data/dispatch-budget-example.json",
  "factory/hangar/data/appeal-example.json",
  "factory/hangar/data/support-disclosure-example.json",
  "factory/quality/current-assessment.json",
  "factory/reference_provenance/WB001-WB010.reference-provenance.2026-08-06.json",
  "factory/reference_provenance/WB011-WB020.reference-provenance.2026-08-06.json",
  "factory/reference_provenance/WB021-WB030.reference-provenance.2026-08-06.json",
  "factory/reference_provenance/WB031-WB040.reference-provenance.2026-08-06.json",
  "factory/rounds/**/*.json",
  "factory/station_kits/**/kit-manifest.json",
  "factory/workbench_standard/commissioning/index.json",
  "factory/workbenches/**/data/**",
  "factory/workbenches/**/results/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Research Factory contributors"
SPDX-License-Identifier = "CC0-1.0"

# Project-authored Hangar graphics, tutorial video, captions and source captures.
[[annotations]]
path = [
  "factory/hangar/public/favicon.svg",
  "factory/hangar/public/og.png",
  "factory/hangar/public/research-factory-hangar-workflow.mp4",
  "factory/hangar/public/research-factory-hangar-workflow.vtt",
  "factory/hangar/public/tutorial-poster.jpg",
  "factory/hangar/video/research-factory-tutorial/assets/screens/**",
  "factory/hangar/video/research-factory-tutorial/meta.json",
  "factory/hangar/video/research-factory-tutorial/narration.txt",
  "factory/hangar/video/research-factory-tutorial/research-factory-hangar-workflow.vtt",
  "factory/hangar/video/research-factory-tutorial/transcript.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Research Factory contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Third-party Geist font subsets retain their upstream licence and notice.
[[annotations]]
path = "factory/hangar/video/research-factory-tutorial/assets/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "2023 Vercel, in collaboration with basement.studio"
SPDX-License-Identifier = "OFL-1.1"
