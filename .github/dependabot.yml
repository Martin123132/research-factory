version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - hangar-construction
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/factory"
    schedule:
      interval: weekly
    labels:
      - hangar-construction
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/factory/hangar"
    schedule:
      interval: weekly
    labels:
      - hangar-construction
    open-pull-requests-limit: 5
    groups:
      # Keep runtime packages and their matching type definitions together.
      react-runtime:
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
          - "@types/react"
          - "@types/react-dom"
      cloudflare-toolchain:
        patterns:
          - "@cloudflare/vite-plugin"
          - "@cloudflare/workers-types"
          - wrangler
      next-framework:
        patterns:
          - next
          - eslint-config-next
