name: Workbench proposal
description: Propose a measurable new station or a stricter boundary for an existing one.
title: "[WORKBENCH] "
labels: ["workbench-proposal"]
body:
  - type: input
    id: station
    attributes:
      label: Workbench code
      description: Use WB-NNN for an existing station or PROPOSED for a new catalogue discussion.
      placeholder: WB-013
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective truth condition
      description: State the input population, required output and what makes the answer objectively correct.
    validations:
      required: true
  - type: textarea
    id: gates
    attributes:
      label: Hard gates and independent verifier
      description: Explain what fails closed and which calculation the candidate cannot control.
    validations:
      required: true
  - type: textarea
    id: utility
    attributes:
      label: Practical or physical value
      description: Explain how an improvement would matter after compute, cost, energy, safety and integration are counted.
    validations:
      required: true
  - type: textarea
    id: starter
    attributes:
      label: Credential-neutral starter gate
      description: Describe a bounded known-answer task that tests method discipline without granting scientific credit.
    validations:
      required: true
  - type: dropdown
    id: patent_intent
    attributes:
      label: Patent intent for disclosed material
      description: Do not open this issue if the answer is unknown or a filing may still be needed.
      options:
        - NONE
        - OPEN_COMMONS
        - FILED_BEFORE_PUBLICATION
    validations:
      required: true
  - type: checkboxes
    id: rights_boundary
    attributes:
      label: Public rights boundary
      options:
        - label: I have the right to submit this public, non-confidential material and have declared material sources, collaborators, institutional interests and AI use.
          required: true
