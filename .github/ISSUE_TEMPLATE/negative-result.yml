name: Negative or boundary result
description: Preserve a reproducible dead end, no-gain result or discovered boundary.
title: "[NEGATIVE] "
labels: ["negative-result"]
body:
  - type: markdown
    attributes:
      value: |
        No workbench is open for live public research. This form currently retains construction findings, synthetic commissioning outcomes and clearly labelled exploration notes only. It cannot record a scientific reproduction or promotion decision.
  - type: dropdown
    id: scope
    attributes:
      label: Current scope
      options: ["HANGAR_CONSTRUCTION", "SYNTHETIC_COMMISSIONING", "EXPLORATION_NOTE_ONLY"]
    validations:
      required: true
  - type: input
    id: station
    attributes:
      label: Workbench code
      placeholder: WB-013
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Classification
      options: ["NO_GAIN", "HYPOTHESIS_REJECTED", "RESOURCE_LIMIT", "UNRUNNABLE", "BOUNDARY_FOUND", "DUPLICATE_DIRECTION", "INVALID", "DISPUTED"]
    validations:
      required: true
  - type: textarea
    id: region
    attributes:
      label: Search region and method
      description: State precisely what was tried, including locked artifacts, parameters and compute.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Decisive evidence
      description: Link reproducible logs, hashes and the gate or measurement that determined the outcome.
    validations:
      required: true
  - type: textarea
    id: revisit
    attributes:
      label: Conditions for revisiting
      description: What new evidence, algorithm, resource limit or assumption would make another attempt non-duplicative?
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Public boundary
      options:
        - label: This issue claims no scientific standing, independent reproduction or promotion eligibility.
          required: true
        - label: I have the right to post the non-confidential material and have not exposed a sealed verdict, hidden answer or patent-sensitive invention.
          required: true
