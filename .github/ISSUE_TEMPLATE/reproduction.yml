name: Independent reproduction
description: Record a rerun owned by a human other than the original author.
title: "[REPRODUCTION] "
labels: ["reproduction"]
body:
  - type: input
    id: claim
    attributes:
      label: Locked claim or submission ID
    validations:
      required: true
  - type: input
    id: validator
    attributes:
      label: Human validator identity
      description: You must not be the claim author or the other required validator.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Independent environment
      description: Hardware, operating system, runner, dependencies, seeds and relevant limits.
    validations:
      required: true
  - type: textarea
    id: commitment
    attributes:
      label: Pre-reveal evidence commitment
      description: Record artifact and result hashes without exposing a sealed answer.
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Bounded verdict
      options: ["PASS", "NO_GAIN", "INVALID", "UNRUNNABLE", "ESCALATE"]
    validations:
      required: true
  - type: checkboxes
    id: independence
    attributes:
      label: Independence declaration
      options:
        - label: I am not the original author and I do not control the other required validator identity.
          required: true

