name: Factory verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: factory-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-runners:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: factory/requirements.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify deterministic station kits
        run: python workbench_standard/generate_station_kits.py --check
      - name: Test control plane
        run: python -m unittest discover -s control_plane/tests -p "test_*.py" -v
      - name: Test WB-001 runner
        run: python -m unittest discover -s workbenches/wb001_lossless_compression/tests -p "test_*.py" -v
      - name: Test workbench standard and adapters
        run: python -m unittest discover -s workbench_standard/tests -p "test_*.py" -v

  hangar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory/hangar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: factory/hangar/package-lock.json
      - name: Install locked Hangar dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build and test Hangar
        run: npm test
