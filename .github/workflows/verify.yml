name: Factory verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: factory-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned licensing and schema tools
        run: python -m pip install reuse==6.2.0 jsonschema==4.26.0
      - name: Verify every tracked path has an explicit licence
        run: reuse lint
      - name: Test asset provenance verifier
        run: python -m unittest discover -s .github/scripts/tests -p "test_*.py" -v
      - name: Verify media provenance and hashes
        run: python .github/scripts/verify_asset_provenance.py
      - name: Verify public repository boundary
        run: python .github/scripts/verify_public_readiness.py
      - name: Verify DCO sign-off on pull-request commits
        if: github.event_name == 'pull_request'
        run: >-
          python .github/scripts/verify_dco.py
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}

  contracts-and-runners:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: factory/requirements.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --progress-spinner off
      - name: Verify append-only shift-report contract
        run: |
          python shift_reports/validate_shift_reports.py shift_reports/examples
          python -m unittest discover -s shift_reports/tests -p "test_*.py" -v
      - name: Verify append-only corrections and retractions
        run: |
          python -m unittest discover -s corrections/tests -p "test_*.py" -v
          python -m corrections.run_synthetic_drill --output state/ci-correction-drill
          python -m corrections.verify_synthetic_drill state/ci-correction-drill
      - name: Verify catalogue reference provenance
        run: |
          python reference_provenance/verify_reference_provenance.py
          python -m unittest discover -s reference_provenance/tests -p "test_*.py" -v
      - name: Verify Open Factory quality profile
        run: |
          python quality/verify_quality.py
          python -m unittest discover -s quality/tests -p "test_*.py" -v
      - name: Verify deterministic station kits
        run: python workbench_standard/generate_station_kits.py --check
      - name: Verify provider-neutral factory engine
        run: |
          python enginectl.py doctor --json
          python -m unittest discover -s engine/tests -p "test_*.py" -v
      - name: Verify offline release and recovery tooling
        run: python -m unittest discover -s release/tests -p "test_*.py" -v
      - name: Verify clean-checkout worker entry gate
        run: >-
          python control_plane/scripts/run_entry_gate.py
          --operator ci:github-actions
          --acknowledge-rules
          --output state/ci-entry.json
      - name: Test control plane
        run: python -m unittest discover -s control_plane/tests -p "test_*.py" -v
      - name: Commission the complete synthetic dispute shift
        run: |
          python commissioning/run_synthetic_shift.py --output state/ci-synthetic-dispute-shift
          python commissioning/verify_synthetic_shift.py state/ci-synthetic-dispute-shift
          python -m unittest discover -s commissioning/tests -p "test_*.py" -v
      - name: Test WB-001 runner
        run: python -m unittest discover -s workbenches/wb001_lossless_compression/tests -p "test_*.py" -v
      - name: Test workbench standard and adapters
        run: python -m unittest discover -s workbench_standard/tests -p "test_*.py" -v

  hangar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory/hangar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: factory/hangar/package-lock.json
      - name: Install locked Hangar dependencies
        run: npm ci
      - name: Audit deployable Hangar dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build and test Hangar
        run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks v8.30.1
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan the complete reachable Git history
        shell: bash
        run: >-
          "$RUNNER_TEMP/gitleaks" git .
          --log-opts="--all"
          --redact=100
          --no-banner
