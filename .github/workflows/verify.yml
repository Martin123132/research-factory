name: Factory verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: factory-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned REUSE checker
        run: python -m pip install reuse==6.2.0
      - name: Verify every tracked path has an explicit licence
        run: reuse lint
      - name: Verify media provenance and hashes
        run: python .github/scripts/verify_asset_provenance.py
      - name: Verify DCO sign-off on pull-request commits
        if: github.event_name == 'pull_request'
        run: >-
          python .github/scripts/verify_dco.py
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}

  contracts-and-runners:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: factory/requirements.lock
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify deterministic station kits
        run: python workbench_standard/generate_station_kits.py --check
      - name: Verify clean-checkout worker entry gate
        run: >-
          python control_plane/scripts/run_entry_gate.py
          --operator ci:github-actions
          --acknowledge-rules
          --output state/ci-entry.json
      - name: Test control plane
        run: python -m unittest discover -s control_plane/tests -p "test_*.py" -v
      - name: Test WB-001 runner
        run: python -m unittest discover -s workbenches/wb001_lossless_compression/tests -p "test_*.py" -v
      - name: Test workbench standard and adapters
        run: python -m unittest discover -s workbench_standard/tests -p "test_*.py" -v

  hangar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory/hangar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: factory/hangar/package-lock.json
      - name: Install locked Hangar dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build and test Hangar
        run: npm test
